# sprintstart-ai settings for ratchet.sh and the ai-guard hooks.
# Paths are git pathspecs relative to the repository root.

SOURCE_PATHS=('src')
TEST_PATHS=('tests')

# Any way of silencing a finding.
SUPPRESSION_RE='#[[:space:]]*(noqa|type:[[:space:]]*ignore|pyright:[[:space:]]*(ignore|basic))|ruff:[[:space:]]*noqa'

# Tests switched off. `skipif` stays allowed: the llm_required markers skip on missing Ollama.
SKIP_RE='pytest\.mark\.(skip|xfail)\b|pytest\.skip\(|pytest\.xfail\('

# Ids passed around as bare str/UUID outside the request/response schemas.
RAWID_RE='\b[a-z_]*_id: (str|UUID)\b'
RAWID_PATHS=('src' ':(exclude)src/api/schemas.py')

# File length.
FILE_LIMIT=400
SIZE_PATHS=(':(glob)src/**/*.py')

# Lint baselines, which may only shrink.
LINT_BASELINES=('ruff-limits-baseline.json' '.importlinter')

# Configuration that decides what is checked.
PROTECTED=('ruff.toml' 'ruff-limits.toml' 'pyrightconfig.json' '.importlinter' '.github/workflows' 'scripts/quality'
    'scripts/ai-guard' '.claude/settings.json' 'AI_RULES.md')

# Comments that narrate history (warning only).
HISTORY_RE='#.*\b([Uu]sed to|[Nn]o longer|[Pp]reviously|the whole change|this change|after the fix|before the fix)\b'
# Comments that cite the rules (failure).
RULE_CITATION_RE='AI_RULES'

# Dependencies logic reaches for instead of taking (pass a clock or an id factory in).
HIDDEN_DEPS_RE='datetime\.(now|utcnow|today)\(|\btime\.time\(|\buuid4\(|\brandom\.[a-z]+\('

# Coverage (scripts/quality/coverage-gate.sh) — `uv run pytest --cov=src --cov-report=xml`.
COVERAGE_REPORT='coverage.xml'
COVERAGE_FORMAT='cobertura'
COVERAGE_SRC_ROOTS=''
DIFF_COVERAGE_MIN=80

# Duplication and dead code (scripts/quality/metrics.sh). Dead code counts unused functions,
# methods, classes and imports; vulture cannot tell a pydantic field from an unused variable, and
# ruff's F841 already catches unused locals.
DUPLICATION_PATHS=('src')
DUPLICATION_FORMATS='python'
DUPLICATION_IGNORE=''
DEADCODE_CMD='uv run --quiet vulture src --min-confidence 60 --ignore-decorators "@router.get,@router.post,@router.put,@router.delete,@router.patch,@app.*,@*.field_validator,@*.model_validator,@field_validator,@model_validator" | grep -cvE "unused (variable|attribute)"'

# Contract copies this repository consumes (it owns agent-stream-events and consumes none).
CONTRACT_COPIES=()

# Mutation testing (scripts/quality/mutation.sh) with mutmut, which needs Linux or WSL.
MUTATION_FILES=(':(glob)src/**/*.py')
MUTATION_MIN=60
# The code a branch adds to a file, for mutation.sh: tokenizer and parser decide, so a line inside a
# docstring or a comment is not mistaken for code.
added_code_lines() { uv run --quiet python scripts/quality/added_code_lines.py "$1" "$2"; }
MUTATION_STATS='mutants/mutmut-cicd-stats.json'

run_mutation() {
    local names
    names=$(printf '%s\n' "$@" | sed -E 's|^src/||; s|\.py$||; s|/|.|g; s|$|.*|')
    rm -f "$MUTATION_STATS"
    local log status
    log=$(mktemp)
    # $names is unquoted on purpose: one mutmut pattern per changed module.
    uv run --quiet mutmut run $names 2>&1 | tee "$log"
    status=${PIPESTATUS[0]}
    # mutmut asserts when no pattern matches a mutant, which is what a branch that only
    # touches modules without a function body (re-exports, aliases, class attributes)
    # produces. There is nothing to judge then, and no stats file says exactly that.
    if [ "$status" -ne 0 ] && grep -q 'nothing matches' "$log"; then
        echo "mutation: the traceback above only means the changed files have no function to mutate"
        rm -f "$log"
        return 0
    fi
    rm -f "$log"
    [ "$status" -eq 0 ] && uv run --quiet mutmut export-cicd-stats
}

# mutmut's "total" counts every mutant of the project; the score uses the ones this run checked.
# A timeout counts as detected, as in PIT.
mutation_counts() {
    [ -f "$MUTATION_STATS" ] || { echo "0 0"; return; }
    stat() { grep -oE "\"$1\"[[:space:]]*:[[:space:]]*[0-9]+" "$MUTATION_STATS" | grep -oE '[0-9]+$'; }
    local detected=$(( $(stat killed) + $(stat timeout) ))
    echo "$detected $(( detected + $(stat survived) + $(stat no_tests) + $(stat suspicious) ))"
}
